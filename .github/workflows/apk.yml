name: apk

on:
  push:
    branches: [dev, main]
    tags: ['v*.*.*']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  # Build an APK from any branch by hand: Actions → apk → Run workflow → pick the branch.
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # publish the dev-latest / latest / vX.Y.Z releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle --no-daemon testDebugUnitTest assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk safety-road-watch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: safety-road-watch-apk
          path: safety-road-watch.apk
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
      # Rolling test builds: one fixed download link per branch.
      #   dev  → release "dev-latest" (what the owner tests)
      #   main → release "latest"     (what was promoted)
      - if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          tag=$([ "$BRANCH" = dev ] && echo dev-latest || echo latest)
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" safety-road-watch.apk --target "$GITHUB_SHA" --prerelease \
            --title "Test build: $BRANCH ${GITHUB_SHA::7}" \
            --notes "Newest APK from $BRANCH @ ${GITHUB_SHA::7}. For a stable version use a vX.Y.Z release."
      # Versioned release: notes are this version's section of CHANGELOG.md.
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          cp safety-road-watch.apk "safety-road-watch-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "safety-road-watch-$GITHUB_REF_NAME.apk" \
            --title "Safety Road Watch $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

name: apk

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle --no-daemon testDebugUnitTest assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk safety-road-watch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: safety-road-watch-apk
          path: safety-road-watch.apk
      # Rolling test build: one stable link to the newest APK from main.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest safety-road-watch.apk --target "$GITHUB_SHA" \
            --title "Latest test build (main ${GITHUB_SHA::7})" \
            --notes "Newest build from main @ ${GITHUB_SHA::7}. For a stable version use a vX.Y.Z release." --prerelease
      # Versioned release: notes are this version's section of CHANGELOG.md.
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          cp safety-road-watch.apk "safety-road-watch-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "safety-road-watch-$GITHUB_REF_NAME.apk" \
            --title "Safety Road Watch $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
